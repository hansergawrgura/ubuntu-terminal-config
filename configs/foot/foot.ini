# ─────────────────────────────────────────────────────────────
# Foot terminal configuration  (Wayland-only)
# Version target: 1.25.x
# Docs:   man foot.ini  /  https://codeberg.org/dnkl/foot
# Validate this file:
#   foot --config=$(pwd)/configs/foot/foot.ini --check-config
# ─────────────────────────────────────────────────────────────

[main]
font=Maple Mono NF CN:size=12
pad=6x6
dpi-aware=no

[cursor]
style=beam
blink=yes

[scrollback]
lines=10000

[colors]
foreground=cdd6f4
background=1e1e2e
cursor=f5e0dc 1e1e2e

regular0=45475a
regular1=f38ba8
regular2=a6e3a1
regular3=f9e2af
regular4=89b4fa
regular5=f5c2e7
regular6=94e2d5
regular7=bac2de

bright0=585b70
bright1=f3779e
bright2=89d88b
bright3=ebd391
bright4=74a8fc
bright5=f2aac2
bright6=85d6c5
bright7=a6adc8

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
search-start=Control+Shift+f
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
