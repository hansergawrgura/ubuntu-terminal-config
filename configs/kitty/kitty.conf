# ─────────────────────────────────────────────────────────────
# Kitty terminal configuration
# Version target: 0.48.x
# Docs:   https://sw.kovidgoyal.net/kitty/conf/
# Themes: kitten themes
# Validate this file (headless):
#   kitty +runpy 'from kitty.config import load_config; bad=[]; load_config("PATH", accumulate_bad_lines=bad); import sys; raise SystemExit(1 if bad else 0)'
# ─────────────────────────────────────────────────────────────

# kitty_mod is the default modifier prefix (ctrl+shift)
kitty_mod ctrl+shift

# ── Font ──────────────────────────────────────────────────────
font_family      family="Maple Mono NF CN"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 12.0
disable_ligatures cursor

# ── Cursor ────────────────────────────────────────────────────
cursor_shape beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# ── Scrollback ────────────────────────────────────────────────
scrollback_lines 10000
scrollback_pager_history_size 50

# ── Mouse ─────────────────────────────────────────────────────
mouse_hide_wait 3.0
url_color #0087bd
url_style curly

# ── Clipboard ─────────────────────────────────────────────────
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask
copy_on_select clipboard

# ── Window ────────────────────────────────────────────────────
remember_window_size no
window_padding_width 6
background_opacity 0.92
dynamic_background_opacity yes
hide_window_decorations titlebar-only
confirm_os_window_close -1

# ── Tabs ──────────────────────────────────────────────────────
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{title}"

# ── Layouts ───────────────────────────────────────────────────
enabled_layouts tall,stack,grid,horizontal

# ── Shell integration ─────────────────────────────────────────
shell_integration enabled

# ── Bell ──────────────────────────────────────────────────────
enable_audio_bell no
visual_bell_duration 0

# ── Keybindings ───────────────────────────────────────────────
# New tab / window / os window
map kitty_mod+t new_tab
map kitty_mod+enter new_window
map kitty_mod+n new_os_window
map kitty_mod+w close_window
# Neighboring windows (split navigation)
map kitty_mod+] neighboring_window right
map kitty_mod+[ neighboring_window left
# Layouts
map kitty_mod+l next_layout
# Font size
map kitty_mod+equal change_font_size all +1.0
map kitty_mod+minus change_font_size all -1.0
map kitty_mod+0   change_font_size all 0
# Clipboard
map kitty_mod+c copy_to_clipboard
map kitty_mod+v paste_from_clipboard
# Tabs
map kitty_mod+right next_tab
map kitty_mod+left  previous_tab
# Scrollback
map kitty_mod+page_up   scroll_page_up
map kitty_mod+page_down scroll_page_down
# Reload config
map kitty_mod+, load_config_file
# Hints kitten — select URLs / paths / hashes on screen
map kitty_mod+e kitten hints
